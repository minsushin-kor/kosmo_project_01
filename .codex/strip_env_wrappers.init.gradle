gradle.projectsEvaluated {
    def envFile = new File(gradle.startParameter.currentDir, ".env")
    if (!envFile.exists()) {
        throw new GradleException(".env file not found: " + envFile.absolutePath)
    }

    def cleanedProperties = [:]
    envFile.eachLine { line ->
        def trimmed = line.trim()
        if (!trimmed.isEmpty() && !trimmed.startsWith("#") && trimmed.contains("=")) {
            def parts = trimmed.split("=", 2)
            def key = parts[0].trim()
            def value = parts[1].trim()

            if (value.length() >= 2 && value.startsWith("<") && value.endsWith(">")) {
                value = value.substring(1, value.length() - 1)
            }

            if (key == "DB_URL") {
                value = value.replaceAll("<([^<>]+)>", "\$1")
            }

            cleanedProperties[key] = value
            System.setProperty(key, value)
        }
    }

    rootProject.tasks.matching { it.name == "bootRun" }.configureEach {
        cleanedProperties.each { key, value ->
            systemProperty key, value
        }
    }
}
