spring.application.name=app

# username
spring.datasource.username=${DB_USERNAME}
# password
spring.datasource.password=${DB_PASSWORD}
# url
spring.datasource.url=${DB_URL}
# driver
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT Configurations
jwt.secret=${JWT_SECRET:defaultLocalDevelopmentDummySecretKeyDoNotUseInProduction12345678}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# FastAPI Configuration
ai.fastapi.base-url=${AI_FASTAPI_BASE_URL:http://localhost:8000}

# React CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# 이미지 파일 저장 경로
app.upload.dir=${UPLOAD_DIR:uploads}

# 이미지 1개 최대 크기: 10MB
app.upload.max-file-size=${UPLOAD_MAX_FILE_SIZE:10485760}

# Multipart 업로드 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
